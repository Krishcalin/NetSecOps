#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0
#conf_file_ver=123456789
#buildno=1517
config system global
    set admintimeout 60
    set admin-lockout-threshold 3
    set alias "edge-fgt-01"
    set hostname "edge-fgt-01"
    set strong-crypto disable
    set timezone "Etc/GMT"
    set admin-https-redirect enable
end
config system password-policy
    set status enable
    set minimum-length 8
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.0
        set allowaccess ping https ssh
        set role wan
        set status up
    next
    edit "internal"
        set vdom "root"
        set ip 10.10.0.1 255.255.255.0
        set allowaccess ping https ssh http telnet
        set role lan
        set status up
        set description "User LAN"
    next
    edit "dmz"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set allowaccess ping
        set role dmz
        set status up
    next
    edit "mgmt"
        set vdom "root"
        set ip 10.100.0.5 255.255.255.0
        set allowaccess ping https ssh snmp
        set role mgmt
        set status up
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2abcdefghijklmnopqrstuvwxyz0123456789
    next
    edit "netsecops"
        set accprofile "netsecops_ro"
        set vdom "root"
        set trusthost1 10.100.0.0 255.255.255.0
        set password ENC SH2zyxwvutsrqponmlkjihgfedcba9876543210
    next
    edit "contractor"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2aaaabbbbccccddddeeeeffffgggghhhh0000
    next
end
config user radius
    edit "corp-radius"
        set server "10.100.5.32"
        set secret ENC R4d1usK3y!Secret
        set auth-type auto
    next
end
config log syslogd setting
    set status enable
    set server "10.100.5.10"
    set port 514
    set facility local7
    set source-ip 10.100.0.5
end
config log memory setting
    set status enable
end
config system ntp
    set ntpsync enable
    set type custom
    set source-ip 10.100.0.5
    config ntpserver
        edit 1
            set server "10.100.5.40"
        next
        edit 2
            set server "10.100.5.41"
        next
    end
end
config system snmp community
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 10.100.5.20 255.255.255.255
            next
        end
    next
end
config system snmp user
    edit "monitor"
        set security-level auth-priv
        set auth-proto sha256
        set auth-pwd ENC SnmpAuthK3y!Secret
        set priv-proto aes256
        set priv-pwd ENC SnmpPrivK3y!Secret
    next
end
config firewall address
    edit "internal-net"
        set type ipmask
        set subnet 10.10.0.0 255.255.255.0
    next
    edit "dmz-net"
        set type ipmask
        set subnet 10.20.0.0 255.255.255.0
    next
    edit "dmz-web-01"
        set type ipmask
        set subnet 10.20.0.10 255.255.255.255
    next
    edit "dmz-web-02"
        set type ipmask
        set subnet 10.20.0.11 255.255.255.255
    next
    edit "dmz-web-01-dup"
        set type ipmask
        set subnet 10.20.0.10 255.255.255.255
    next
    edit "mgmt-net"
        set type ipmask
        set subnet 10.100.0.0 255.255.255.0
    next
    edit "partner-range"
        set type iprange
        set start-ip 198.51.100.10
        set end-ip 198.51.100.20
    next
    edit "orphaned-object"
        set type ipmask
        set subnet 192.0.2.0 255.255.255.0
    next
end
config firewall addrgrp
    edit "dmz-web-servers"
        set member "dmz-web-01" "dmz-web-02"
    next
    edit "all-dmz"
        set member "dmz-web-servers" "dmz-net"
    next
end
config firewall service custom
    edit "HTTPS-443"
        set tcp-portrange 443
    next
    edit "HTTP-80"
        set tcp-portrange 80
    next
    edit "SSH-22"
        set tcp-portrange 22
    next
    edit "TELNET-23"
        set tcp-portrange 23
    next
    edit "DNS-53"
        set udp-portrange 53
    next
    edit "HIGH-PORTS"
        set tcp-portrange 1024-65535
    next
end
config firewall service group
    edit "web-services"
        set member "HTTPS-443" "HTTP-80"
    next
end
config wireless-controller vap
    edit "corp-wifi"
        set ssid "Corp-WiFi"
        set security wpa2-only-enterprise
        set auth-server "RADIUS-1"
        set pmf enable
        set broadcast-ssid enable
        set intra-vap-privacy disable
        set vlanid 20
        set status enable
    next
    edit "guest-wifi"
        set ssid "Guest-WiFi"
        set security captive-portal
        set broadcast-ssid enable
        set intra-vap-privacy enable
        set vlanid 30
        set status enable
    next
    edit "legacy-wifi"
        set ssid "Legacy-WiFi"
        set security wpa-personal
        set passphrase ENC SH2abcdefghijklmnopqrstuvwxyz0123456789
        set broadcast-ssid disable
        set vlanid 40
        set status disable
    next
end
config wireless-controller wtp
    edit "FP231F1234567890"
        set name "ap-floor-1"
        set wtp-profile "FAP231F-default"
    next
end
config system ha
    set group-name "edge-cluster"
    set mode a-p
    set hbdev "port9" 50
    set priority 200
    set override disable
end
config firewall vip
    edit "web-vip"
        set extip 203.0.113.10
        set extintf "wan1"
        set portforward enable
        set mappedip "10.20.0.10"
        set extport 443
        set mappedport 443
    next
    edit "rdp-vip"
        set extip 203.0.113.11
        set extintf "wan1"
        set portforward enable
        set mappedip "10.20.0.11"
        set extport 3389
        set mappedport 3389
    next
    edit "orphan-vip"
        set extip 203.0.113.50
        set extintf "wan1"
        set mappedip "10.20.0.50"
    next
end
config firewall policy
    edit 1
        set name "Mgmt to DMZ SSH"
        set srcintf "mgmt"
        set dstintf "dmz"
        set srcaddr "mgmt-net"
        set dstaddr "all-dmz"
        set action accept
        set schedule "always"
        set service "SSH-22"
        set logtraffic all
        set ips-sensor "default"
    next
    edit 2
        set name "Block telnet inbound"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "TELNET-23"
        set logtraffic all
    next
    edit 3
        set name "Partner telnet to web"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "partner-range"
        set dstaddr "dmz-web-01"
        set action accept
        set schedule "always"
        set service "TELNET-23"
        set logtraffic all
    next
    edit 4
        set name "Inbound web"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "dmz-web-servers"
        set action accept
        set schedule "always"
        set service "web-services"
        set logtraffic all
        set ips-sensor "default"
        set av-profile "default"
        set ssl-ssh-profile "certificate-inspection"
    next
    edit 5
        set name "LAN outbound any"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "internal-net"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
    edit 6
        set name "Legacy rule"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "internal-net"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HIGH-PORTS"
        set logtraffic all
        set status disable
    next
    edit 7
        set name "Permit everything"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
    edit 8
        set name "Implicit deny replacement"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
config vpn certificate local
    edit "Fortinet_Factory"
        set comments "Factory certificate"
    next
end
