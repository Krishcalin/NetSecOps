!
! Standalone Cisco Aironet access point, IOS 15.3(3)JBB.
!
! Written from Cisco's own published autonomous-AP configuration examples. The point of
! the fixture is the join: an SSID's cipher is not on the SSID, it is on the radio
! interface keyed by the SSID's VLAN.
!
version 15.3
hostname ap-plant-01
!
no service pad
service password-encryption
!
enable secret 5 $1$abcd$eFgHiJkLmNoPqRsTuV
!
aaa new-model
aaa authentication login default group radius local
aaa authentication login eap_methods group rad_eap
!
! The group references the server; `radius-server host` is what defines it. Both lines
! appear in Cisco's own autonomous-AP examples, and a group on its own would be a
! reference to nothing.
aaa group server radius rad_eap
 server 10.20.0.10 auth-port 1812 acct-port 1813
!
radius-server host 10.20.0.10 auth-port 1812 acct-port 1813 key 7 05080F1C2243
radius-server timeout 5
!
dot11 ssid CORP-SECURE
 vlan 10
 authentication open eap eap_methods
 authentication network-eap rad_eap
 authentication key-management wpa version 2
 mbssid guest-mode
!
dot11 ssid PLANT-PSK
 vlan 20
 authentication open
 authentication key-management wpa version 2
 wpa-psk ascii 7 070C285F4D06
 mbssid guest-mode
!
dot11 ssid LEGACY-SCANNERS
 vlan 30
 authentication open
 authentication key-management wpa
 wpa-psk ascii 7 0822455D0A16
 mbssid guest-mode
!
dot11 ssid OLD-HANDHELD
 vlan 40
 authentication open
 guest-mode
!
dot11 ssid CONTRACTOR
 vlan 50
 authentication open
!
dot11 ssid DECOMMISSIONED
 vlan 60
 authentication open
 authentication key-management wpa version 2
 wpa-psk ascii 7 104D000A0618
!
interface Dot11Radio0
 no ip address
 encryption vlan 10 mode ciphers aes-ccm
 encryption vlan 20 mode ciphers aes-ccm
 encryption vlan 30 mode ciphers tkip
 encryption vlan 40 mode wep mandatory
 ssid CORP-SECURE
 ssid PLANT-PSK
 ssid LEGACY-SCANNERS
 ssid OLD-HANDHELD
 ssid CONTRACTOR
 station-role root
!
interface Dot11Radio1
 no ip address
 shutdown
 station-role root
!
interface GigabitEthernet0
 no ip address
 duplex auto
 speed auto
!
interface BVI1
 ip address 10.20.30.9 255.255.255.0
!
ip default-gateway 10.20.30.1
!
ntp server 10.20.0.5
!
line con 0
line vty 0 4
 transport input ssh
!
end
