!
! A deliberately weak configuration, for checks that must FAIL.
! Same device as hardened_switch.cfg, before hardening — so a diff between the two
! is a realistic drift scenario rather than an artificial one.
!
version 15.2
service timestamps debug uptime
service timestamps log uptime
no service password-encryption
service pad
!
hostname core-sw-01
!
no aaa new-model
!
tacacs-server host 10.100.5.30 key T4c4csK3y!Secret
radius-server host 10.100.5.32 auth-port 1645 acct-port 1646 key R4d1usK3y!Secret
!
ip domain-name lab.example.com
ip domain-lookup
ip source-route
ip bootp server
ip http server
ip http secure-server
!
service tcp-small-servers
service udp-small-servers
ip finger
!
vtp mode server
vtp password VtpP4ssw0rd
!
spanning-tree mode pvst
!
vlan 10
 name USERS
!
username admin privilege 15 password 0 Admin123
username cisco privilege 15 password 7 070C285F4D06
!
enable password cisco123
!
interface GigabitEthernet1/0/1
 switchport mode dynamic desirable
 switchport access vlan 10
!
interface GigabitEthernet1/0/2
 switchport mode access
 switchport access vlan 10
!
interface Vlan1
 ip address 10.10.10.2 255.255.255.0
 ip proxy-arp
 ip redirects
 ip directed-broadcast
!
router ospf 1
 network 10.10.10.0 0.0.0.255 area 0
!
logging buffered 4096 debugging
!
snmp-server community public RO
snmp-server community private RW
snmp-server location LAB
!
ntp server 10.100.5.40
!
access-list 10 permit 10.100.0.0 0.0.255.255
access-list 10 deny   any log
access-list 99 permit any
!
banner motd ^C
Welcome to core-sw-01. Please log in.
^C
!
line con 0
 exec-timeout 0 0
line aux 0
 exec-timeout 0 0
 transport input all
line vty 0 4
 exec-timeout 0 0
 password cisco
 login
 transport input telnet ssh
 transport output telnet
line vty 5 15
 exec-timeout 0 0
 transport input all
 transport output telnet
!
end
