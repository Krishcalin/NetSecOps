!
! Catalyst 9800 wireless controller
!
version 17.9
hostname wlc-9800-01
!
no ip http server
ip http secure-server
!
aaa new-model
aaa authentication login default group RADIUS-GROUP local
aaa authentication dot1x default group RADIUS-GROUP
aaa authorization exec default group RADIUS-GROUP local
aaa accounting exec default start-stop group RADIUS-GROUP
!
radius server RAD-1
 address ipv4 10.100.5.60 auth-port 1812 acct-port 1813
 key 7 08351F1B4A0C0A0E
!
aaa group server radius RADIUS-GROUP
 server name RAD-1
!
line vty 0 4
 transport input ssh
 exec-timeout 10 0
!
wlan Corp-WiFi 1 Corp-WiFi
 security dot1x authentication-list RADIUS-GROUP
 security wpa akm dot1x
 security wpa wpa2
 security wpa wpa2 ciphers aes
 security pmf mandatory
 security ft
 broadcast-ssid
 no shutdown
!
wlan Guest-WiFi 2 Guest-WiFi
 no security wpa
 no security wpa akm dot1x
 no security wpa wpa2
 no security ft
 broadcast-ssid
 no peer-blocking
 no shutdown
!
wlan Staff-PSK 3 Staff-PSK
 security wpa psk set-key ascii 0 St4ffW1FiPsk
 security wpa akm psk
 security wpa wpa2
 security wpa wpa2 ciphers aes
 security pmf optional
 broadcast-ssid
 peer-blocking drop
 no shutdown
!
wlan IoT-Hidden 4 IoT-Hidden
 security wpa akm psk
 security wpa wpa2
 no broadcast-ssid
 no security pmf
 shutdown
!
wlan Modern-SAE 5 Modern-SAE
 security wpa akm sae
 security wpa wpa3
 security pmf mandatory
 broadcast-ssid
 no shutdown
!
wireless wps rogue detection
!
ap 00aa.bb11.2233
 policy-tag campus-policy
!
end
