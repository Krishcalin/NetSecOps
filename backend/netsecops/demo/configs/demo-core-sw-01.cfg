!Command: show running-config
!Running configuration last done at: Mon Sep  7 21:14:02 2026
!
! demo-core-sw-01 — the middle of the path.
!
! Hardened, and carries no rulebase at all, which is the point: when a path crosses
! this device the answer is "no decision", not "allowed". A router that inspected
! nothing is not a control that was checked.
!
version 10.3(4a)
hostname demo-core-sw-01
!
feature ssh
feature ospf
feature interface-vlan
feature lacp
!
password strength-check
!
username netops password 5 $5$abcdefgh$ijklmnopqrstuvwxyz role network-admin
username monitor password 5 $5$hgfedcba$zyxwvutsrqponmlkji role network-operator
!
ssh key rsa 2048
!
no ip domain-lookup
!
aaa authentication login default group TACACS-GRP local
aaa authentication login console local
aaa accounting default group TACACS-GRP
!
tacacs-server host 10.100.5.30 key 7 08351F1B4A0C0A0E timeout 5
tacacs-server host 10.100.5.31 key 7 08351F1B4A0C0A0E timeout 5
!
aaa group server tacacs+ TACACS-GRP
    server 10.100.5.30
    server 10.100.5.31
    use-vrf management
!
snmp-server user monitor network-operator auth md5 0x1234abcd priv 0xdeadbeef localizedkey
snmp-server host 10.100.5.20 traps version 3 priv monitor
!
ntp server 10.100.5.40 use-vrf management
ntp server 10.100.5.41 use-vrf management
!
logging server 10.100.5.10 5 use-vrf management
logging server 10.100.5.11 5 use-vrf management
logging logfile messages 6
logging timestamp milliseconds
logging source-interface mgmt0
!
spanning-tree mode rapid-pvst
spanning-tree port type edge bpduguard default
!
ip dhcp snooping
!
vlan 10
  name USERS
vlan 20
  name VOICE
!
vrf context management
  ip route 0.0.0.0/0 10.100.0.1
!
interface Vlan10
  description USER GATEWAY
  no shutdown
  ip address 10.10.10.1/24
!
interface Ethernet1/1
  description DOWNLINK TO demo-access-sw-01
  switchport
  switchport mode trunk
  no shutdown
!
interface Ethernet1/47
  description TRANSIT TO demo-edge-fw-01
  no switchport
  ip address 10.0.1.1/30
  no shutdown
!
interface Ethernet1/48
  description UNUSED
  shutdown
!
interface mgmt0
  description OOB MANAGEMENT
  vrf member management
  ip address 10.100.0.9/24
!
ip route 10.20.0.0/24 10.0.1.2
ip route 0.0.0.0/0 10.0.1.2
!
ip access-list MGMT-IN
  10 permit tcp 10.100.0.0/16 any eq 22
  20 deny ip any any log
!
router ospf 1
  router-id 10.10.10.1
  area 0.0.0.0 authentication message-digest
!
line vty
  exec-timeout 10
!
