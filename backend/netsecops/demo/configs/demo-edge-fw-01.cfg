! demo-edge-fw-01 — the device that makes the path answer honest.
!
! It permits the traffic, and it translates. Because the path continues past it to
! the DMZ firewall, the devices after it were asked about the addresses in the query
! rather than the ones the packet was carrying — so the verdict is
! `partially-allowed` with this device named, not `allowed`.
!
! The version is deliberately 9.18(2): old enough that the shipped advisory sample
! matches it, so the vulnerability engine has something real to find.
!
ASA Version 9.18(2)
!
hostname demo-edge-fw-01
domain-name demo.example.com
enable password $sha512$5000$abcdefgh$ijklmnop pbkdf2
!
names
!
interface GigabitEthernet0/0
 description WAN UPLINK
 nameif outside
 security-level 0
 ip address 198.51.100.2 255.255.255.248
!
interface GigabitEthernet0/1
 description TRANSIT TO demo-core-sw-01
 nameif inside
 security-level 100
 ip address 10.0.1.2 255.255.255.252
!
interface GigabitEthernet0/2
 description TRANSIT TO demo-dmz-fw-01
 nameif dmz
 security-level 50
 ip address 10.0.2.1 255.255.255.252
!
interface Management0/0
 description OOB
 management-only
 nameif management
 security-level 100
 ip address 10.100.0.10 255.255.255.0
!
ftp mode passive
!
object network OBJ-USER-NET
 subnet 10.10.10.0 255.255.255.0
object network OBJ-DMZ-NET
 subnet 10.20.0.0 255.255.255.0
object network OBJ-WEB-SERVER
 host 10.20.0.10
object service SVC-HTTPS
 service tcp destination eq 443
!
object-group network GRP-ADMIN-HOSTS
 network-object host 10.100.5.50
 network-object host 10.100.5.51
object-group service GRP-WEB-PORTS tcp
 port-object eq 80
 port-object eq 443
!
access-list OUTSIDE-IN remark Permit inbound HTTPS to the published web server
access-list OUTSIDE-IN extended permit tcp any host 10.20.0.10 eq 443 log
access-list OUTSIDE-IN extended deny ip any any log
!
access-list INSIDE-IN remark Users reach the DMZ and the internet
access-list INSIDE-IN extended permit ip 10.10.10.0 255.255.255.0 any
access-list INSIDE-IN extended permit tcp object-group GRP-ADMIN-HOSTS any object-group GRP-WEB-PORTS
access-list INSIDE-IN extended deny ip any any log
!
access-list DMZ-IN extended permit tcp 10.20.0.0 255.255.255.0 any eq 443
access-list DMZ-IN extended deny ip any any log
!
access-group OUTSIDE-IN in interface outside
access-group INSIDE-IN in interface inside
access-group DMZ-IN in interface dmz
!
nat (inside,outside) source dynamic OBJ-USER-NET interface
nat (dmz,outside) source static OBJ-WEB-SERVER interface service SVC-HTTPS SVC-HTTPS
!
route dmz 10.20.0.0 255.255.255.0 10.0.2.2 1
route inside 10.10.10.0 255.255.255.0 10.0.1.1 1
route outside 0.0.0.0 0.0.0.0 198.51.100.1 1
!
aaa-server TACACS-GRP protocol tacacs+
aaa-server TACACS-GRP (management) host 10.100.5.30
 key *****
 timeout 5
!
aaa authentication ssh console TACACS-GRP LOCAL
aaa authentication http console TACACS-GRP LOCAL
!
username netops password $sha512$5000$qrstuvwx$yzabcdef pbkdf2 privilege 15
username readonly password $sha512$5000$hgfedcba$vutsrqpo pbkdf2 privilege 5
!
http server enable 443
http 10.100.5.0 255.255.255.0 management
!
ssh stricthostkeycheck
ssh 10.100.5.0 255.255.255.0 management
ssh timeout 10
ssh version 2
ssh cipher encryption high
!
console timeout 5
!
password-policy minimum-length 12
password-policy lifetime 90
!
ntp server 10.100.5.40 key 1 source management prefer
ntp server 10.100.5.41 key 1 source management
!
logging enable
logging timestamp
logging buffered informational
logging trap informational
logging host management 10.100.5.10
logging host management 10.100.5.11
!
snmp-server host management 10.100.5.20 community RoCommunity9f3a version 2c
snmp-server location DEMO-RACK-2
snmp-server contact netops@demo.example.com
!
banner login AUTHORISED ACCESS ONLY. Activity is monitored and logged.
!
failover
failover lan unit primary
failover lan interface FO GigabitEthernet0/3
!
: end
