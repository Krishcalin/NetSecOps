!
! demo-access-sw-01 — the access layer, and the reason anybody buys this.
!
! Nothing here is exotic. It is a switch that was stood up quickly, worked, and was
! never revisited: telnet still enabled, SNMP still on the default communities, no
! AAA, passwords in the clear, no session timeout. Every one of those is a finding,
! and every one of them is ordinary.
!
version 15.2
service timestamps debug uptime
service timestamps log uptime
no service password-encryption
service pad
!
hostname demo-access-sw-01
!
no aaa new-model
!
tacacs-server host 10.100.5.30 key T4c4csK3y-demo
radius-server host 10.100.5.32 auth-port 1645 acct-port 1646 key R4d1usK3y-demo
!
ip domain-name demo.example.com
ip domain-lookup
ip source-route
ip bootp server
ip http server
ip http secure-server
!
service tcp-small-servers
service udp-small-servers
ip finger
!
vtp mode server
vtp password VtpP4ssw0rd
!
spanning-tree mode pvst
!
vlan 10
 name USERS
!
vlan 20
 name VOICE
!
username admin privilege 15 password 0 Admin123
username demo privilege 15 password 7 070C285F4D06
!
enable password demo123
!
interface GigabitEthernet0/1
 description USER ACCESS PORT
 switchport mode dynamic desirable
 switchport access vlan 10
!
interface GigabitEthernet0/2
 description USER ACCESS PORT
 switchport mode access
 switchport access vlan 10
!
interface GigabitEthernet0/24
 description UPLINK TO demo-core-sw-01
 switchport mode trunk
!
interface Vlan10
 description USER SVI
 ip address 10.10.10.5 255.255.255.0
 ip proxy-arp
 ip redirects
 ip directed-broadcast
!
ip route 0.0.0.0 0.0.0.0 10.10.10.1
!
logging buffered 4096 debugging
!
snmp-server community public RO
snmp-server community private RW
snmp-server location DEMO-RACK-1
!
ntp server 10.100.5.40
!
access-list 10 permit 10.100.0.0 0.0.255.255
access-list 10 deny   any log
access-list 99 permit any
!
banner motd ^C
Welcome to demo-access-sw-01. Please log in.
^C
!
line con 0
 exec-timeout 0 0
line vty 0 4
 exec-timeout 0 0
 password demo
 login
 transport input telnet ssh
line vty 5 15
 exec-timeout 0 0
 transport input all
!
end
