id: password-policy-history
title: Password reuse is prevented
description: >-
  The password policy remembers previous passwords and refuses them.
rationale: >-
  Without a history, a password expiry policy achieves nothing: the administrator
  changes the password and changes it straight back, or cycles between two. The device
  records a compliant change event either way, so the control reports success while
  delivering none — which is worse than not having it, because it produces evidence of
  a rotation that did not happen.
severity: low

logic:
  type: ncm
  expression: management.password_policy.history
  assert:
    gte: 5
  missing: not_evaluated

remediation: >-
  Set the policy to remember at least five previous passwords. If the platform enforces
  expiry without a history, consider whether the expiry is worth keeping at all — a
  rotation that can be satisfied by changing a password twice is a reporting artefact
  rather than a control.

references:
  nist_800_53: ["IA-5"]
  pci_dss: ["8.3.7"]
  iso_27001: ["A.5.17"]
  cwe: ["CWE-262"]

tags: [authentication, management-plane]
