id: no-weak-password-hashes
title: No local account uses reversible or weak password storage
description: >-
  Local account passwords are stored with the platform's strongest available hash, not
  in plaintext, a reversible encoding, or unsalted MD5.
rationale: >-
  Cisco type 0 is the password itself. Type 7 is a fixed XOR with a published key —
  reversible by any of a dozen websites in the time it takes to paste it, and it exists
  only to stop shoulder-surfing. Type 5 is unsalted MD5, which falls to a commodity GPU.
  Because configurations are routinely copied into backups, ticketing systems and
  vendor support cases, a weak hash means the password is effectively distributed
  wherever the configuration has ever been sent.
severity: high

logic:
  type: python
  function: no_weak_password_hashes

remediation: >-
  Re-enter each affected password using the strongest scheme the platform offers —
  `secret 9` (scrypt) on modern Cisco IOS, `secret 8` (PBKDF2) where 9 is unavailable.
  Note that `service password-encryption` only produces type 7 and is not a fix.
  Rotate the passwords as well: the old values should be treated as disclosed.

references:
  cis: ["1.1.2", "1.1.3"]
  nist_800_53: ["IA-5"]
  pci_dss: ["8.3.2"]
  iso_27001: ["A.5.17"]
  cwe: ["CWE-257", "CWE-916"]

tags: [accounts, crypto, cis-level-1]
