id: aaa-local-fallback
title: Authentication falls back to local credentials
description: >-
  The default authentication method list names a local fallback after the AAA server
  group.
rationale: >-
  This check exists for availability rather than confidentiality, and it is the one
  case where the safe answer is *more* local access rather than less. If the TACACS+
  or RADIUS servers are unreachable — a routing failure, a certificate expiry, a
  maintenance window — a device with no fallback cannot be logged into at all, and
  the outage it is part of cannot be diagnosed. Without it the recovery path is
  console access and a password reset.
severity: medium

applicability:
  # Only where central AAA exists. A device authenticating locally already has local
  # access by definition and cannot be locked out by a server it does not use.
  #
  # `requires_features` rather than `logic.requires`: this treats an empty list as
  # absent, and `requires` does not — it tests for null, so a device with no AAA
  # servers satisfied it and the guard never fired.
  requires_features: [aaa.servers]

logic:
  type: ncm
  expression: aaa.local_fallback
  assert:
    equals: true
  # The "only where central AAA exists" guard lives in `applicability` and not here.
  # `logic.requires` tests for null, and a device with no AAA servers has an empty
  # list, which is not null — so the guard never fired. It went unnoticed because the
  # parser could not set `local_fallback` to False either, and the check reported Not
  # Evaluated for both reasons at once.

remediation: >-
  Append `local` to the default authentication method list — on Cisco IOS,
  `aaa authentication login default group TACACS-GRP local`. Make sure a local account
  with a strong, stored password actually exists, since the fallback is useless
  otherwise.

references:
  cis: ["1.3.1"]
  nist_800_53: ["CP-2", "IA-2"]
  iso_27001: ["A.5.29"]
  cea: ["Access Control"]

tags: [aaa, availability, cis-level-1]
