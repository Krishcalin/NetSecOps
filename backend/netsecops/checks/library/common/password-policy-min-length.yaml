id: password-policy-min-length
title: A minimum password length of at least 12 is enforced
description: >-
  Where the platform supports a password policy, the minimum length is 12 characters
  or more.
rationale: >-
  Network device passwords are rarely rotated and often stored with a fast hash, so
  length is the main defence against offline cracking once a configuration leaks.
  Twelve characters is the point at which a brute-force attack against even an
  unsalted MD5 hash stops being trivially affordable.
severity: medium

logic:
  type: ncm
  expression: management.password_policy.min_length
  assert:
    gte: 12
  requires: [management.password_policy.min_length]

remediation: >-
  Raise the configured minimum password length to at least 12. Where the platform has
  no such setting, enforce the requirement in the central AAA system instead, and
  treat this check as Not Applicable for the device.

references:
  cis: ["1.1.7"]
  nist_800_53: ["IA-5"]
  pci_dss: ["8.3.6"]
  iso_27001: ["A.5.17"]
  cwe: ["CWE-521"]

tags: [accounts, password-policy]
