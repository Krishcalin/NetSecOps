id: aaa-servers-have-keys
title: Every AAA server has a shared secret
description: >-
  Each configured TACACS+ or RADIUS server has a shared key.
rationale: >-
  The shared secret is what binds an authentication response to the server that is
  supposed to have issued it. Without one, an attacker positioned on the path — or
  merely able to answer faster than the real server — can return an accept for any
  credential and gain privileged access to the device. The device will believe it
  followed its authentication policy exactly.
severity: critical

logic:
  type: python
  function: aaa_servers_have_keys

remediation: >-
  Configure a unique, high-entropy shared key on every AAA server statement and on the
  matching client definition on the server itself. Use a different key per device
  where your AAA platform supports it, so one recovered key does not authenticate the
  estate.

references:
  cis: ["1.3.2"]
  nist_800_53: ["IA-3", "IA-5", "SC-8"]
  pci_dss: ["8.3.1"]
  iso_27001: ["A.5.17"]
  cwe: ["CWE-306", "CWE-345"]
  cea: ["Access Control"]

tags: [aaa, crypto, cis-level-1]
