id: fortios-password-complexity
title: The administrative password policy requires complexity
description: >-
  `config system password-policy` is enabled with character-class requirements.
rationale: >-
  FortiOS ships with no password policy at all: an administrator may set a one-character
  password and the device will accept it. The policy block is the only mechanism that
  constrains administrative passwords on the box itself, and it is inert unless
  `set status enable` is present — which is why a configuration can appear to have a
  policy while enforcing nothing.
severity: medium

applicability:
  vendors: [fortinet]
  platforms: [fortios]

logic:
  type: ncm
  expression: management.password_policy.complexity_required
  assert:
    equals: true
  missing: not_evaluated

remediation: >-
  `config system password-policy` / `set status enable` / `set min-lower-case-letter 1` /
  `set min-upper-case-letter 1` / `set min-number 1` / `set min-non-alphanumeric 1` /
  `end`. Where administrators authenticate against RADIUS or TACACS+, the policy on the
  identity provider governs instead — but the local break-glass account is still subject
  to this one, and is the account that matters most.

references:
  cis: ["1.1.1"]
  nist_800_53: ["IA-5"]
  pci_dss: ["8.3.6"]
  iso_27001: ["A.5.17"]
  cwe: ["CWE-521"]

tags: [authentication, management-plane, fortinet]
