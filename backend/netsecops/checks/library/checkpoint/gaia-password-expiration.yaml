id: gaia-password-expiration
title: Administrative passwords expire
description: >-
  `password-controls password-expiration-days` is set to a finite period.
rationale: >-
  Gaia defaults to passwords that never expire. Current guidance has moved away from
  routine rotation for user accounts, and rightly — forced monthly changes produce
  predictable passwords. Shared infrastructure administrative accounts are the case the
  guidance still makes an exception for: they are known to more people than any user
  account, they are rarely tied to an individual's leaving process, and the same
  password commonly persists across every device in the estate. An expiry is the
  backstop for the credential nobody remembers to change.
severity: low

applicability:
  vendors: [checkpoint]
  platforms: [checkpoint_gaia]

logic:
  type: ncm
  expression: management.password_policy.max_age_days
  assert:
    lte: 365
  missing: fail

remediation: >-
  `set password-controls password-expiration-days 365`, and prefer moving administrators
  to central authentication so the identity provider's policy governs instead. Where the
  account is break-glass, an expiry that locks it at the moment it is needed is worse
  than none — exempt it deliberately and record why.

references:
  nist_800_53: ["IA-5"]
  iso_27001: ["A.5.17"]
  cwe: ["CWE-262"]

tags: [authentication, checkpoint]
enabled_by_default: false
