id: wlan-pmf-enabled
title: Protected Management Frames are not disabled
description: >-
  No SSID has 802.11w management-frame protection explicitly turned off.
rationale: >-
  Without PMF, management frames are unauthenticated, so anyone in range can send a
  deauthentication frame that knocks a client off the network. That is a denial of
  service on its own, and it is also the first step of the standard attack: force a
  reconnection, capture the handshake, crack it offline. PMF is mandatory for WPA3 and
  optional for WPA2, which means most estates have it available and switched off.
severity: medium

applicability:
  device_classes: [wireless_controller, firewall, switch]
  requires_features: [wireless.wlans]

logic:
  type: ncm
  # Only the explicitly disabled ones. A WLAN that never mentions PMF has not been shown
  # to have it off — the platform default varies by release — and reporting those would
  # bury the ones somebody deliberately turned off.
  expression: wireless.wlans[?pmf == 'disabled' || pmf == 'disable'].ssid
  assert:
    empty: true
  missing: not_evaluated

remediation: >-
  Set PMF to optional on WPA2 networks, which protects clients that support it and does
  not exclude those that do not, and to required on WPA3. Check for legacy clients
  first: a few older devices refuse to associate when PMF is required.

references:
  nist_800_53: ["SC-5", "AC-18"]
  iso_27001: ["A.8.20"]
  cwe: ["CWE-306"]
  cea: ["Wireless Security"]

tags: [wireless]
