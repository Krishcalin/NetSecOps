id: cisco-arp-inspection-enabled
title: Dynamic ARP inspection is enabled
description: >-
  Dynamic ARP inspection is configured on user VLANs.
rationale: >-
  ARP has no authentication: any host may claim any address. ARP spoofing lets an
  attacker on the same VLAN silently insert themselves between two hosts, or between a
  host and its gateway, and the tooling to do it has been point-and-click for twenty
  years. Dynamic ARP inspection validates ARP replies against the DHCP snooping binding
  table and drops the ones that lie.
severity: high

applicability:
  vendors: [cisco]
  platforms: [cisco_ios, cisco_iosxe, cisco_nxos]
  device_classes: [switch]

logic:
  type: ncm
  expression: l2.arp_inspection_enabled
  assert:
    equals: true
  missing: fail

remediation: >-
  Enable `ip arp inspection vlan <list>` for user VLANs and trust the uplinks. DHCP
  snooping must be enabled first, since inspection validates against its binding
  table; hosts with static addresses need an ARP ACL or they will be blocked.

references:
  cis: ["3.3.2"]
  nist_800_53: ["SC-7", "SI-4"]
  pci_dss: ["1.3.1"]
  iso_27001: ["A.8.22"]
  cwe: ["CWE-290"]

tags: [layer2, edge-security, cisco, cis-level-2]
