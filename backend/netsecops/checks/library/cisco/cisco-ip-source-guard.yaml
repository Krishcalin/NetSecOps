id: cisco-ip-source-guard
title: Access ports verify the source address of what they forward
description: >-
  Every access port runs `ip verify source`, so a host can only send using the address
  DHCP snooping recorded against its port.
rationale: >-
  DHCP snooping builds a binding table of which address belongs on which port, and
  dynamic ARP inspection uses it to stop ARP poisoning. IP source guard is the third
  user of the same table and the one that stops plain source-address spoofing: without
  it, a host can set any source address it likes and the switch forwards it.

  That matters in two directions. Traffic spoofed from another host's address lands
  that host with the consequences, and every log, NetFlow record and firewall rule
  keyed on source address is then wrong about who did what. It also defeats controls
  that trust an address — an ACL permitting a management subnet is bypassed by a host
  that simply claims one of its addresses.

  The binding table is already being built wherever DHCP snooping is on, so this is
  enforcement the switch is mostly doing the work for already.
severity: medium

applicability:
  vendors: [cisco]
  platforms: [cisco_ios, cisco_iosxe]
  device_classes: [switch]
  # Source guard reads the DHCP snooping binding table, so without snooping there is
  # nothing for it to enforce against. A device with snooping off has one problem, and
  # `cisco-dhcp-snooping-enabled` reports it at high severity; adding a finding per
  # access port would bury that under the consequence of it.
  requires_features: [l2.dhcp_snooping_enabled]

logic:
  type: ncm
  # Access ports that are actually up. A trunk carries traffic for hosts attached
  # elsewhere, so there is no binding to check it against and requiring it there would
  # be a finding on every uplink in the estate. A shut port forwards nothing and so
  # cannot spoof anything — the same reasoning by which `connected_routes` declines to
  # derive a route from an admin-down interface — and including them would put a
  # finding on every unused port, which is how a check gets ignored.
  expression: >-
    interfaces[?mode == 'access' && admin_up != `false`
               && security.ip_source_guard != `true`].name
  assert:
    empty: true
  requires: [interfaces]

remediation: >-
  Add `ip verify source` to access ports once DHCP snooping is enabled and its binding
  table has populated. Use `ip verify source port-security` where MAC spoofing matters
  as well as address spoofing. Hosts with static addresses need an `ip source binding`
  entry, or they will be filtered — which is the usual reason a rollout is reverted, so
  enumerate them first.

references:
  nist_800_53: ["SC-7", "SI-4", "AC-4"]
  pci_dss: ["1.3.1"]
  iso_27001: ["A.8.22"]
  cwe: ["CWE-290"]
  cea: ["Network Security"]

tags: [layer2, edge-security, spoofing, cisco]
