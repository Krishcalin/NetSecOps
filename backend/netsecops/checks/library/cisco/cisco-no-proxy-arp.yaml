id: cisco-no-proxy-arp
title: Proxy ARP is disabled on user-facing interfaces
description: >-
  No interface answers ARP requests on behalf of hosts on other subnets.
rationale: >-
  Proxy ARP lets the router answer for addresses that are not its own. It papers over
  hosts with a wrong or missing default gateway, which is how it survives in networks
  that no longer need it. The cost is that it leaks the router's knowledge of the
  topology to anyone who asks, extends the ARP attack surface beyond the local subnet,
  and makes ARP-based controls harder to reason about.
severity: low

applicability:
  vendors: [cisco]
  platforms: [cisco_ios, cisco_iosxe]

logic:
  type: ncm
  expression: "interfaces[?proxy_arp == `true`].name"
  assert:
    empty: true
  requires: [interfaces]

remediation: >-
  Configure `no ip proxy-arp` on each listed interface, or globally where the platform
  allows it. Confirm first that no host relies on it — a host with a wrong subnet mask
  may lose connectivity when it is removed.

references:
  cis: ["1.4.7"]
  nist_800_53: ["CM-7", "SC-7"]
  cwe: ["CWE-200"]

tags: [control-plane, cisco, cis-level-1]
