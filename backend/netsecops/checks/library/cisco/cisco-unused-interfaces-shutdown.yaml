id: cisco-unused-interfaces-shutdown
title: Unused interfaces are administratively shut down
description: >-
  Interfaces with no description, no address and no VLAN assignment are shut down
  rather than left enabled.
rationale: >-
  A live port in an unlocked room, a ceiling void or a meeting room is physical access
  to the network that requires no credential and leaves no trace. Shutting unused ports
  is the cheapest physical-layer control there is. The three-part test — no description,
  no address, no VLAN — is deliberately conservative, so a port that is merely
  undocumented is not reported.
severity: low

applicability:
  vendors: [cisco]
  platforms: [cisco_ios, cisco_iosxe]
  device_classes: [switch]

logic:
  type: python
  function: unused_interfaces_shutdown

remediation: >-
  Shut down the listed interfaces and place them in an unused, non-routed VLAN. Confirm
  each is genuinely unused before applying: an undescribed port may still be carrying
  something nobody documented.

references:
  cis: ["3.4.2"]
  nist_800_53: ["PE-3", "CM-7", "SC-7"]
  pci_dss: ["1.3.1", "9.1.2"]
  iso_27001: ["A.7.2", "A.8.22"]
  cea: ["Network Security"]

tags: [layer2, physical-security, cisco, cis-level-2]
