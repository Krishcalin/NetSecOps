id: cisco-vtp-password-set
title: VTP is password protected
description: >-
  Where VTP is running in server or client mode, a VTP password is configured.
rationale: >-
  VTP propagates the VLAN database between switches. Without a password, any switch
  plugged into a trunk can advertise a VLAN database with a higher revision number and
  every switch in the domain will adopt it — including a database with no VLANs, which
  removes every access port from its VLAN and takes the entire switched network down.
  This has been done accidentally, by connecting a lab switch, more often than it has
  been done maliciously.
severity: high

applicability:
  vendors: [cisco]
  platforms: [cisco_ios, cisco_iosxe]

logic:
  type: ncm
  expression: l2.vtp_password_set
  assert:
    equals: true
  requires: [l2.vtp_mode]
  missing: fail

remediation: >-
  Set a VTP password on every switch in the domain (`vtp password <value>`), or move
  the estate to `vtp mode transparent` and manage VLANs explicitly. Transparent mode
  is the more common modern choice, because the operational cost of manual VLAN
  management is lower than the risk VTP carries.

references:
  cis: ["3.1.1"]
  nist_800_53: ["IA-3", "SC-7"]
  iso_27001: ["A.8.22"]
  cwe: ["CWE-306"]

tags: [layer2, availability, cisco]
