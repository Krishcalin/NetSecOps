id: cisco-native-vlan-not-default
title: Trunk native VLAN is not VLAN 1
description: >-
  Trunk interfaces use a dedicated native VLAN rather than the default VLAN 1.
rationale: >-
  Frames in the native VLAN cross a trunk untagged. If the native VLAN is also a user
  VLAN — and VLAN 1 is the default for every access port — an attacker can craft a
  double-tagged frame that the first switch strips once and forwards into a VLAN they
  should not reach. VLAN hopping needs no exploit, only the default configuration on
  both ends.
severity: medium

applicability:
  vendors: [cisco]
  platforms: [cisco_ios, cisco_iosxe]
  device_classes: [switch]

logic:
  type: ncm
  expression: "interfaces[?native_vlan == `1`].name"
  assert:
    empty: true
  requires: [interfaces]

remediation: >-
  Set an unused, dedicated VLAN as the native VLAN on every trunk
  (`switchport trunk native vlan <id>`), and make sure both ends of each trunk agree —
  a mismatch causes spanning-tree inconsistency and can black-hole the link.

references:
  cis: ["3.5.1"]
  nist_800_53: ["SC-7"]
  pci_dss: ["1.3.1"]
  iso_27001: ["A.8.22"]
  cwe: ["CWE-284"]
  cea: ["Network Security"]

tags: [layer2, vlan-hopping, cisco, cis-level-2]
