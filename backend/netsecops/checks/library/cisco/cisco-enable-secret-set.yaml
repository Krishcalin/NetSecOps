id: cisco-enable-secret-set
title: Privileged mode uses `enable secret`, not `enable password`
description: >-
  The device has no `enable password` statement; privileged-mode access is protected
  by `enable secret`.
rationale: >-
  `enable password` stores the value as plaintext, or as type 7 if service password
  encryption is on — reversible either way. `enable secret` stores a hash. Where both
  are configured the device uses the secret, so the password statement serves no
  purpose except to publish the credential to anyone who reads the configuration. It
  is frequently the same password, which is why this matters more than it appears.
severity: high

applicability:
  vendors: [cisco]
  platforms: [cisco_ios, cisco_iosxe]

logic:
  type: regex
  pattern: '^enable password '
  expect: absent

remediation: >-
  Remove the statement with `no enable password`, having confirmed an `enable secret`
  is configured. Rotate the value: the old one should be considered disclosed to
  everyone who has ever seen a copy of this configuration.

references:
  cis: ["1.1.2"]
  nist_800_53: ["IA-5", "AC-6"]
  pci_dss: ["8.3.2"]
  cwe: ["CWE-257"]

tags: [accounts, cisco, cis-level-1]
