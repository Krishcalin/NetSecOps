id: cisco-service-password-encryption
title: Service password encryption is enabled
description: >-
  `service password-encryption` is configured, so passwords that would otherwise be
  stored in plaintext are at least obscured.
rationale: >-
  This setting produces Cisco type 7, which is reversible and therefore not
  encryption in any meaningful sense. It is still worth having, for one narrow reason:
  it prevents a password appearing in full on a screen during a change window or in a
  screenshot pasted into a ticket. It must never be relied on as protection — a
  configuration containing type 7 passwords should be handled as though they were
  plaintext, because they are.
severity: low

applicability:
  vendors: [cisco]
  platforms: [cisco_ios, cisco_iosxe]

logic:
  type: ncm
  expression: management.password_policy.encryption_enabled
  assert:
    equals: true
  missing: fail

remediation: >-
  Configure `service password-encryption`. Then treat it as cosmetic and address the
  underlying issue: move the affected credentials to `secret 9` hashes or to central
  AAA, which is what the `no-weak-password-hashes` check is about.

references:
  cis: ["1.1.3"]
  nist_800_53: ["IA-5"]
  pci_dss: ["8.3.2"]
  cwe: ["CWE-261"]
  cea: ["Access Control"]

tags: [accounts, cisco, cis-level-1]
