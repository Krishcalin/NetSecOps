id: aaa-no-cleartext-credentials
title: No account on the AAA server stores its password in the clear
description: >-
  No local account uses cleartext password storage.
rationale: >-
  A tac_plus configuration with `login = cleartext` holds the password as readable text
  in a file on disk, which is then in every backup, every configuration management
  repository and every support bundle that file has ever been included in. This is the
  AAA server, so those are the credentials for administering the network. Unlike a hash,
  there is nothing to crack and no work factor to argue about.
severity: critical

applicability:
  requires_features: [aaa_server.product]

logic:
  type: ncm
  expression: users[?secret_type == 'cleartext'].name
  assert:
    empty: true
  missing: not_evaluated

remediation: >-
  Re-create the affected accounts with a hashed credential, and treat every password
  that was stored this way as disclosed — change it rather than re-hashing the same
  string. Better still, move administrator authentication to the directory and keep only
  a break-glass account locally.

references:
  nist_800_53: ["IA-5"]
  pci_dss: ["8.3.2"]
  iso_27001: ["A.5.17"]
  cwe: ["CWE-256", "CWE-312"]

tags: [aaa, authentication]
