id: aaa-servers-have-shared-secrets
title: Every AAA server is configured with a shared secret
description: >-
  No RADIUS or TACACS+ server entry is missing its key.
rationale: >-
  The shared secret is what authenticates the *server* to the device and protects the
  RADIUS packet's authenticator. Without it, anything that can reach the device on the
  RADIUS port can answer an authentication request with an Access-Accept, and the device
  will believe it. A server entry with no key usually means a half-finished change
  rather than a decision, and it will not announce itself — authentication simply keeps
  working through the other server until that one fails.
severity: high

applicability:
  requires_features: [aaa.servers]

logic:
  type: ncm
  expression: aaa.servers[?key_configured == `false`].host
  assert:
    empty: true
  missing: not_evaluated

remediation: >-
  Set a key on every server entry, and use a different one per device where the platform
  and the operational model allow it — see `aaa-shared-secret-not-reused`. NetSecOps
  never reads the key itself, only whether one is present.

references:
  nist_800_53: ["IA-3", "SC-8"]
  pci_dss: ["8.3.1"]
  iso_27001: ["A.8.24"]
  cwe: ["CWE-306"]
  cea: ["Access Control"]

tags: [aaa, authentication]
