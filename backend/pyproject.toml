[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netsecops"
version = "0.1.0"
description = "NetSecOps — read-only network configuration & vulnerability assessment platform"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Krishnendu De" }]

# Runtime dependencies for Phase 0 (Foundation).
# Later phases add device-access and parsing libraries (scrapli, netmiko, asyncssh,
# ciscoconfparse2, ttp, lxml) — see SRS §2.2. They are deliberately NOT installed yet
# so the Phase 0 image stays minimal and auditable.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "pyotp>=2.9",
    "qrcode[pil]>=8.0",
    "cryptography>=43.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "typer>=0.15",
    "rich>=13.9",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    # Phase 3 — the check engine. Checks are YAML, their logic is JMESPath over the
    # NCM, and applicability is decided by comparing device versions to a range.
    "pyyaml>=6.0",
    "jmespath>=1.0",
    "packaging>=24.2",
    # Phase 4 — PAN-OS and Check Point export XML. defusedxml, not the stdlib parser:
    # a device configuration is attacker-influenced input, and ElementTree will happily
    # process external entities and billion-laughs expansions (SEC-05).
    "defusedxml>=0.7",
    # Device access (Phase 1). asyncssh provides both the client and the in-process
    # test server, so TEST-02's "no live devices in CI" needs nothing extra.
    "asyncssh>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Tests open real sockets (the fake SSH device); a hang must fail the build
    # rather than stall CI until the job limit.
    "pytest-timeout>=2.3",
    "factory-boy>=3.3",
    "hypothesis>=6.119",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
    "schemathesis>=3.38",
    "types-passlib",
    "types-defusedxml",
]

[project.scripts]
netsecops-cli = "netsecops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["netsecops"]

# ─────────────────────────── ruff ───────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "ASYNC",     # async correctness
    "S",         # bandit-style security
    "RUF",
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S104",   # binding 0.0.0.0 is intentional inside containers
    # ASYNC109 prefers asyncio.timeout() at the call site over a timeout parameter.
    # FR-COL-05 requires per-device, per-command timeouts, so the transport API takes
    # one explicitly and applies it internally; pushing it to callers would mean every
    # adapter re-implementing the same wrapper.
    "ASYNC109",
]

# Typographic characters used deliberately in prose and section rules.
allowed-confusables = ["×", "—", "–", "’", "‘", "“", "”", "…"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]   # asserts and dummy secrets are fine in tests
"netsecops/db/migrations/*" = ["I001", "E402"]

# ─────────────────────────── mypy ───────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["netsecops/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["pyotp.*", "qrcode.*", "factory.*", "ciscoconfparse2.*"]
ignore_missing_imports = true

# ─────────────────────────── pytest ─────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Performance tests commit real rows and take seconds rather than milliseconds, so
# they are opt-in: run them with `-m performance`.
addopts = "-ra --strict-markers -m 'not performance'"
# No single test should take a minute. Socket-based tests that hang must fail.
timeout = 60
timeout_method = "thread"
markers = [
    "authz: role × endpoint authorization matrix tests (TEST-06)",
    "integration: requires a live PostgreSQL instance",
    "performance: load tests for NFR-PERF-01 and ADR-001; excluded from the default run",
]

[tool.coverage.run]
source = ["netsecops"]
omit = ["netsecops/db/migrations/*", "netsecops/cli.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ─────────────────────────── bandit ─────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "netsecops/db/migrations"]
# B105 (hardcoded password string) fires on every enum member whose *name* contains
# TOKEN or PASSWORD — audit action labels and permission names, none of which are
# secrets. Ruff enforces the identical rule as S105 with per-line exemptions where they
# are justified, so the check is still applied; it is simply owned by one tool.
skips = ["B105"]
